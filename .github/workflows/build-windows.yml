name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exclude workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Install dependencies
        run: npm ci

      - name: Verify 7zip-bin
        shell: pwsh
        run: Test-Path node_modules/7zip-bin/win/x64/7za.exe

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist -- --win --x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: glyph-folio-windows
          path: |
            desktop/dist/*.exe
