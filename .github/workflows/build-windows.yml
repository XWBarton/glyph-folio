name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist -- --win --x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyph-folio-windows
          path: |
            desktop/dist/*.exe

      - name: Publish rolling release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest desktop/dist/*.exe \
            --title "Latest build (main)" \
            --notes "Automated Windows build from main @ ${{ github.sha }}. Unsigned — Windows SmartScreen will warn on first run." \
            --prerelease
